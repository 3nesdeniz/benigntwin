[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "benigntwin"
dynamic = ["version"]
description = "Benchmark prompt-injection detectors and LLM guardrails on matched benign/attack pairs: attack recall, false-positive rate and pair accuracy, per attack family and per language."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Enes Deniz", email = "enes@altaysec.com.tr" }]
keywords = [
    "prompt-injection",
    "llm-security",
    "guardrails",
    "ai-security",
    "benchmark",
    "evaluation",
    "false-positive-rate",
    "hard-negatives",
    "jailbreak-detection",
    "multilingual",
    "red-team",
    "blue-team",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
hf = ["transformers>=4.40", "torch>=2.2"]
# "hub" was an extra in 0.1.0. Hub datasets now load with the standard library;
# the name is kept so existing install commands keep working.
hub = ["pyarrow>=14"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.11", "pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/3nesdeniz/benigntwin"
Documentation = "https://github.com/3nesdeniz/benigntwin/tree/main/docs"
Repository = "https://github.com/3nesdeniz/benigntwin"
Issues = "https://github.com/3nesdeniz/benigntwin/issues"
Changelog = "https://github.com/3nesdeniz/benigntwin/blob/main/CHANGELOG.md"

[project.scripts]
benigntwin = "benigntwin.cli:main"

[tool.hatch.version]
path = "src/benigntwin/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benigntwin"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # code blocks in the docs are illustrative

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "C4", "PT", "RUF"]
ignore = [
    "E501",   # long lines are left to the formatter
    "S101",   # assert is used for narrowing and in tests
    "PT011",  # pytest.raises without match is fine for simple cases
    "PT018",  # compound assertions keep related checks on one line
]
# Turkish text (dotless i) and en dashes in ranges are intentional.
allowed-confusables = ["ı", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017", "BLE"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "transformers.*", "torch.*"]
ignore_missing_imports = true
