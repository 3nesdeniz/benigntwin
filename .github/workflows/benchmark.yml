# Runs the pinned benchmark suite (benchmarks/suite.json) and uploads the reports.
# Started by hand or by pushing to the run-benchmark branch. It has no write access: the results are reviewed and committed separately.
name: Benchmark

on:
  # A push to the branch "run-benchmark" starts a full run; this also works
  # before the workflow exists on the default branch.
  push:
    branches: [run-benchmark]
  workflow_dispatch:
    inputs:
      detectors:
        description: "Detector keys separated by spaces (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      detectors: ${{ steps.list.outputs.detectors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          REQUESTED: ${{ inputs.detectors }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          keys = [entry["key"] for entry in json.load(open("benchmarks/suite.json"))["detectors"]]
          requested = os.environ.get("REQUESTED", "").split()
          unknown = [key for key in requested if key not in keys]
          if unknown:
              raise SystemExit(f"unknown detector keys: {unknown}")
          print("detectors=" + json.dumps(requested or keys))
          PY

  run:
    needs: plan
    name: ${{ matrix.detector }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        detector: ${{ fromJson(needs.plan.outputs.detectors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[hf]"
          python -m pip freeze > environment.txt
      - name: Run
        env:
          DETECTOR: ${{ matrix.detector }}
        run: python benchmarks/run_suite.py --detector "$DETECTOR" --output results/raw
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-${{ matrix.detector }}
          path: |
            results/raw
            environment.txt
          if-no-files-found: error

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: raw-*
          path: downloaded
      - name: Build the tables
        run: |
          rm -rf results
          mkdir -p results/raw
          for directory in downloaded/raw-*; do cp -R "$directory"/results/raw/. results/raw/; done
          python benchmarks/build_results.py
          cat results/README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: results
          if-no-files-found: error
