# Builds the package for a version tag and publishes it to PyPI with Trusted Publishing.
# Needs a "pypi" environment in this repository and a matching trusted publisher on PyPI.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build and check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
          version=$(python -c "import re; print(re.search(r'\"(.+?)\"', open('src/benigntwin/_version.py').read()).group(1))")
          test "v$version" = "$TAG" || { echo "tag $TAG does not match package version $version"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    # Set the repository variable PYPI_PUBLISH to "true" once the trusted publisher exists on PyPI.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
